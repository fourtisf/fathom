# Noxsea Nginx site. Install as /etc/nginx/sites-available/noxsea and symlink into sites-enabled.
# Plain HTTP on purpose: `certbot --nginx -d noxsea.xyz -d www.noxsea.xyz -d api.noxsea.xyz`
# then adds the TLS server blocks and the HTTP→HTTPS redirect.
# CLAUDE.md §0 rule 3: access logs are off; the client IP is passed to the app (rate limiting) but never logged.

server {
    listen 80;
    listen [::]:80;
    server_name www.noxsea.xyz;
    access_log off;
    return 301 https://noxsea.xyz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name noxsea.xyz;

    access_log off;
    # error_log cannot be disabled; at crit, request lines (which carry client IPs) are not written.
    error_log /var/log/nginx/noxsea-error.log crit;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.noxsea.xyz;

    access_log off;
    error_log /var/log/nginx/noxsea-api-error.log crit;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off; # stream SSE chat completions
        proxy_read_timeout 300s;
    }
}
