# Fathom Nginx config. Replace fathom.ai with the final domain (see packages/config brand).
# TLS: `certbot certonly --webroot -w /var/www/certbot -d fathom.ai -d www.fathom.ai -d api.fathom.ai`
# CLAUDE.md §0 rule 3: access logs are off; IPs are forwarded to the app but never logged.

server {
    listen 80;
    listen [::]:80;
    server_name fathom.ai www.fathom.ai api.fathom.ai;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Shared proxy settings.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fathom.ai www.fathom.ai;

    ssl_certificate     /etc/letsencrypt/live/fathom.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fathom.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    # error_log cannot be disabled; keep it at crit so request lines (with client IPs) are not written.
    error_log /var/log/nginx/fathom-error.log crit;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr; # passed through for rate limiting only
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.fathom.ai;

    ssl_certificate     /etc/letsencrypt/live/fathom.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fathom.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    error_log /var/log/nginx/fathom-api-error.log crit;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr; # passed through for rate limiting only
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off; # stream SSE chat completions
        proxy_read_timeout 300s;
    }
}
